name: Publish PV calculator

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pv-calculator-pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy calculator
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source and tests
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s pv-model.js
          node --check pv-model.js
          node --check app.js
          node --test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
