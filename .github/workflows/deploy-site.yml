name: Publish PV calculator
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source and tests
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s pv-model.js
          node --check pv-model.js
          node --check app.js
          node --test
